th:0.5;" fill="#FEFFDD"/><text x="306" y="342.292" fill="#000" font-size="13" textLength="256.515" font-family="Arial">Public registration creates the user role only.</text><text x="306" y="357.241" fill="#000" font-size="13" textLength="164.766" font-family="Arial">Admin accounts are seeded.</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="69"><path d="M249,563.099 L249,602.996 A0,0 0 0 0 249,602.996 L629.131,602.996 A0,0 0 0 0 629.131,602.996 L629.131,573.099 L619.131,563.099 L443,563.099 L439,545.222 L435,563.099 L249,563.099 A0,0 0 0 0 249,563.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M619.131,563.099 L619.131,573.099 L629.131,573.099 L619.131,563.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="255" y="580.292" fill="#000" font-size="13" textLength="359.131" font-family="Arial">Bearer token is verified and the user is loaded from MongoDB.</text><text x="255" y="595.241" fill="#000" font-size="13" textLength="291.224" font-family="Arial">Response envelope: { success, data: PublicUser }.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="73"><path d="M281.5,711.099 L281.5,750.996 A0,0 0 0 0 281.5,750.996 L596.587,750.996 A0,0 0 0 0 596.587,750.996 L596.587,721.099 L586.587,711.099 L443,711.099 L439,693.222 L435,711.099 L281.5,711.099 A0,0 0 0 0 281.5,711.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M586.587,711.099 L586.587,721.099 L596.587,721.099 L586.587,711.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="287.5" y="728.292" fill="#000" font-size="13" textLength="294.087" font-family="Arial">Client clears its token; the legacy cookie is cleared.</text><text x="287.5" y="743.241" fill="#000" font-size="13" textLength="267.338" font-family="Arial">Stateless JWTs are not revoked on the server.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-link-type="